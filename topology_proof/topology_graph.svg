<text x="260" y="323" class="label">P1+</text>
<path d="M140,175 Q78,270.0 140,365 Q202,270.0 140,175" fill="none" stroke="#286ed0" stroke-width="3"/>
<text x="60" y="275.0" class="label">S1</text>
<path d="M440,175 Q378,270.0 440,365 Q502,270.0 440,175" fill="none" stroke="#286ed0" stroke-width="3"/>
<text x="360" y="275.0" class="label">S2</text>
<circle cx="140" cy="175" r="7" fill="#182433"/>
<text x="152" y="182" class="label">G1</text>
<circle cx="140" cy="365" r="7" fill="#182433"/>
<text x="152" y="372" class="label">H1</text>
<circle cx="440" cy="175" r="7" fill="#182433"/>
<text x="452" y="182" class="label">G2</text>
<circle cx="440" cy="365" r="7" fill="#182433"/>
<text x="452" y="372" class="label">H2</text>
<text x="165" y="436" class="note">V=4, E=8, cycle rank=5</text>
<text x="785" y="116" class="label">K-: two planar + two spatial circles</text>
<path d="M720,175 Q870,110 1020,175 Q870,240 720,175" fill="none" stroke="#23926b" stroke-width="3"/>
<text x="840" y="133" class="label">P0-</text>
<path d="M720,365 Q870,300 1020,365 Q870,430 720,365" fill="none" stroke="#23926b" stroke-width="3"/>
<text x="840" y="323" class="label">P1-</text>
<path d="M720,175 Q658,270.0 720,365 Q782,270.0 720,175" fill="none" stroke="#286ed0" stroke-width="3"/>
<text x="640" y="275.0" class="label">S3</text>
<path d="M1020,175 Q958,270.0 1020,365 Q1082,270.0 1020,175" fill="none" stroke="#286ed0" stroke-width="3"/>
