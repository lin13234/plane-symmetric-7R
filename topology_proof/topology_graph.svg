<circle cx="720" cy="175" r="7" fill="#182433"/>
<text x="732" y="182" class="label">G3</text>
<circle cx="720" cy="365" r="7" fill="#182433"/>
<text x="732" y="372" class="label">H3</text>
<circle cx="1020" cy="175" r="7" fill="#182433"/>
<text x="1032" y="182" class="label">G4</text>
<circle cx="1020" cy="365" r="7" fill="#182433"/>
<text x="1032" y="372" class="label">H4</text>
<text x="745" y="436" class="note">V=4, E=8, cycle rank=5</text>
<text x="48" y="493" class="label">Four additional detached planar circles: q5=pi (coincident J4/J6 axes)</text>
<circle cx="160" cy="573" r="39" fill="none" stroke="#a35b12" stroke-width="3"/>
<text x="126" y="640" class="label">F0,-1</text>
<circle cx="450" cy="573" r="39" fill="none" stroke="#a35b12" stroke-width="3"/>
<text x="416" y="640" class="label">F0,+1</text>
<circle cx="740" cy="573" r="39" fill="none" stroke="#a35b12" stroke-width="3"/>
<text x="706" y="640" class="label">F1,-1</text>
<circle cx="1030" cy="573" r="39" fill="none" stroke="#a35b12" stroke-width="3"/>
<text x="996" y="640" class="label">F1,+1</text>
<text x="48" y="695" class="note">8 planar circles; 4 spatial circles; 6 connected components; first Betti number = 14.</text>
<text x="48" y="721" class="note">G and H lie on different planar circles. They connect through spatial arcs; BP signs are assembly labels.</text>
